[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-gcal"
description = "Schedule Taskwarrior 'next' tasks into free slots on Google Calendar."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Daniel Dvorkin" }]
license = { text = "MIT" }
keywords = ["taskwarrior", "google-calendar", "scheduling", "productivity", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dynamic = ["version"]
dependencies = [
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.28.0",
    "tzlocal>=5.2",
    "python-dateutil>=2.9.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/MZAWeb/task-gcal"
Repository = "https://github.com/MZAWeb/task-gcal"
Issues = "https://github.com/MZAWeb/task-gcal/issues"

[project.scripts]
task-gcal = "task_gcal.cli:main"

[tool.setuptools.dynamic]
version = { attr = "task_gcal.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
